name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nordicdrive
          POSTGRES_PASSWORD: nordicdrive
          POSTGRES_DB: nordicdrive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nordicdrive -d nordicdrive"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nordicdrive:nordicdrive@localhost:5432/nordicdrive?schema=public
      DIRECT_URL: postgresql://nordicdrive:nordicdrive@localhost:5432/nordicdrive?schema=public
      AUTH_SECRET: ci-auth-secret-replace-in-production
      AUTH_URL: http://localhost:3000
      JWT_SECRET: ci-jwt-secret-that-is-long-enough-for-validation
      JWT_ISSUER: nordicdrive
      JWT_AUDIENCE: nordicdrive-api
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      OPENAI_API_KEY: ""
      OPENAI_MODEL: gpt-5.6-luna
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      ALGOLIA_APP_ID: ""
      ALGOLIA_SEARCH_API_KEY: ""
      ALGOLIA_CARS_INDEX_NAME: nordicdrive_cars
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Deploy migrations
        run: pnpm --filter @nordicdrive/database prisma:deploy

      - name: Validate official catalogue evidence
        run: pnpm catalog:check

      - name: Test official catalogue safeguards
        run: pnpm catalog:test

      - name: Test public catalogue claims
        run: pnpm catalog:test-web

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          temporaryPublicStorage: true
