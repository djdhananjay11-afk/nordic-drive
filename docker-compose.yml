services:
  postgres:
    image: postgres:16-alpine
    container_name: nordicdrive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nordicdrive
      POSTGRES_PASSWORD: nordicdrive
      POSTGRES_DB: nordicdrive
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nordicdrive -d nordicdrive"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      API_PORT: 4000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://nordicdrive:nordicdrive@postgres:5432/nordicdrive?schema=public
      JWT_SECRET: replace-with-a-long-random-secret
      JWT_ISSUER: nordicdrive
      JWT_AUDIENCE: nordicdrive-api
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      DATABASE_URL: postgresql://nordicdrive:nordicdrive@postgres:5432/nordicdrive?schema=public
      AUTH_SECRET: replace-with-openssl-rand-base64-32
      AUTH_URL: http://localhost:3000
      ALGOLIA_APP_ID: ""
      ALGOLIA_SEARCH_API_KEY: ""
      ALGOLIA_CARS_INDEX_NAME: nordicdrive_cars
      OPENAI_API_KEY: ""
    ports:
      - "3000:3000"

volumes:
  postgres-data:
